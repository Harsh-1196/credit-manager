name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff Lint & Format Check
        working-directory: ./backend
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy Type Check
        working-directory: ./backend
        run: |
          mypy .

      - name: Dependency Vulnerability Audit (pip-audit)
        working-directory: ./backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run Pytest with Coverage Gate (>= 85%)
        working-directory: ./backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/shg_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/shg_test
        run: |
          pytest --cov=app.domain --cov=app.services --cov-fail-under=85 --cov-report=term-missing tests/

  frontend:
    name: Frontend Type Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Dependency Vulnerability Audit (npm audit)
        working-directory: ./frontend
        run: npm audit --audit-level=critical || true

      - name: TypeScript Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Vitest Tests
        working-directory: ./frontend
        run: npm test

      - name: Production Build
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Build Validation & Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: shg-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: shg-frontend:test

  deploy-production:
    name: Production Deployment & Smoke Verification
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client for smoke test
        run: pip install httpx

      - name: Deploy to Cloud Provider (Render / Railway / Webhook)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Triggering deployment webhook..."
            curl -f -X POST "$DEPLOY_WEBHOOK_URL"
          else
            echo "No deploy webhook configured; skipping automated trigger."
          fi

      - name: Run Post-Deploy Smoke Tests
        env:
          TARGET_URL: ${{ secrets.PRODUCTION_APP_URL || 'http://localhost:8000' }}
        run: |
          python scripts/smoke_test.py --url "$TARGET_URL" || true
