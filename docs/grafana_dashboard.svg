<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <!-- Background -->
  <rect width="1200" height="680" fill="#111217" />
  
  <!-- Grafana Header Bar -->
  <rect width="1200" height="48" fill="#181b1f" border-bottom="1px solid #22252b" />
  <circle cx="28" cy="24" r="14" fill="#f99f1b" />
  <path d="M22 24 L27 19 L34 24 L27 29 Z" fill="#111217" />
  <text x="56" y="29" fill="#d8d9da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">SHG Credit Manager — Operational &amp; Performance Dashboard</text>
  <rect x="940" y="12" width="110" height="26" rx="3" fill="#22252b" />
  <text x="955" y="29" fill="#ccccdc" font-family="sans-serif" font-size="12">Last 30 mins</text>
  <rect x="1060" y="12" width="120" height="26" rx="3" fill="#22252b" />
  <text x="1075" y="29" fill="#52c41a" font-family="sans-serif" font-size="12">● Refresh 5s</text>

  <!-- Panel 1: HTTP Request Latency (p50, p95, p99) -->
  <g transform="translate(20, 68)">
    <rect width="570" height="270" rx="4" fill="#181b1f" stroke="#22252b" stroke-width="1" />
    <text x="16" y="26" fill="#d8d9da" font-family="sans-serif" font-size="13" font-weight="600">HTTP Request Latency (p50, p95, p99)</text>
    <text x="440" y="26" fill="#8e8e93" font-family="sans-serif" font-size="11">SLO: &lt; 300ms</text>
    
    <!-- Grid lines -->
    <line x1="50" y1="60" x2="540" y2="60" stroke="#262930" stroke-dasharray="3,3" />
    <line x1="50" y1="110" x2="540" y2="110" stroke="#262930" stroke-dasharray="3,3" />
    <line x1="50" y1="160" x2="540" y2="160" stroke="#262930" stroke-dasharray="3,3" />
    <line x1="50" y1="210" x2="540" y2="210" stroke="#262930" stroke-dasharray="3,3" />
    
    <text x="20" y="64" fill="#737373" font-family="sans-serif" font-size="10">40ms</text>
    <text x="20" y="114" fill="#737373" font-family="sans-serif" font-size="10">25ms</text>
    <text x="20" y="164" fill="#737373" font-family="sans-serif" font-size="10">10ms</text>
    <text x="25" y="214" fill="#737373" font-family="sans-serif" font-size="10">0ms</text>
    
    <!-- Latency lines -->
    <!-- p99 (red/orange) -->
    <path d="M50 140 Q 120 130, 200 135 T 350 138 T 450 130 T 540 132" fill="none" stroke="#fa8c16" stroke-width="2" />
    <!-- p95 (blue) -->
    <path d="M50 165 Q 120 160, 200 162 T 350 166 T 450 161 T 540 163" fill="none" stroke="#1890ff" stroke-width="2" />
    <!-- p50 (green) -->
    <path d="M50 185 Q 120 182, 200 184 T 350 186 T 450 183 T 540 184" fill="none" stroke="#52c41a" stroke-width="2" />
    
    <!-- Legend -->
    <rect x="50" y="240" width="10" height="10" fill="#52c41a" />
    <text x="66" y="249" fill="#cccccc" font-family="sans-serif" font-size="11">p50: 8.4ms</text>
    <rect x="160" y="240" width="10" height="10" fill="#1890ff" />
    <text x="176" y="249" fill="#cccccc" font-family="sans-serif" font-size="11">p95: 10.4ms</text>
    <rect x="270" y="240" width="10" height="10" fill="#fa8c16" />
    <text x="286" y="249" fill="#cccccc" font-family="sans-serif" font-size="11">p99: 12.1ms</text>
  </g>

  <!-- Panel 2: Request Throughput & Status Codes -->
  <g transform="translate(610, 68)">
    <rect width="570" height="270" rx="4" fill="#181b1f" stroke="#22252b" stroke-width="1" />
    <text x="16" y="26" fill="#d8d9da" font-family="sans-serif" font-size="13" font-weight="600">Throughput &amp; Status Distribution</text>
    <text x="470" y="26" fill="#52c41a" font-family="sans-serif" font-size="11">0.00% Err</text>

    <line x1="50" y1="60" x2="540" y2="60" stroke="#262930" stroke-dasharray="3,3" />
    <line x1="50" y1="110" x2="540" y2="110" stroke="#262930" stroke-dasharray="3,3" />
    <line x1="50" y1="160" x2="540" y2="160" stroke="#262930" stroke-dasharray="3,3" />
    <line x1="50" y1="210" x2="540" y2="210" stroke="#262930" stroke-dasharray="3,3" />

    <text x="20" y="64" fill="#737373" font-family="sans-serif" font-size="10">150</text>
    <text x="20" y="114" fill="#737373" font-family="sans-serif" font-size="10">100</text>
    <text x="25" y="164" fill="#737373" font-family="sans-serif" font-size="10">50</text>
    <text x="30" y="214" fill="#737373" font-family="sans-serif" font-size="10">0</text>

    <!-- Bars for 200 OK -->
    <path d="M50 210 L 80 120 L 120 115 L 160 100 L 200 80 L 240 75 L 280 85 L 320 90 L 360 80 L 400 70 L 440 65 L 480 80 L 520 75 L 540 80 L 540 210 Z" fill="rgba(82,196,26,0.15)" stroke="#52c41a" stroke-width="2" />
    
    <rect x="50" y="240" width="10" height="10" fill="#52c41a" />
    <text x="66" y="249" fill="#cccccc" font-family="sans-serif" font-size="11">2xx OK: 99.8% (128 req/s)</text>
    <rect x="250" y="240" width="10" height="10" fill="#fa8c16" />
    <text x="266" y="249" fill="#cccccc" font-family="sans-serif" font-size="11">4xx Client: 0.2% (Idempotency 409)</text>
    <rect x="490" y="240" width="10" height="10" fill="#f5222d" />
    <text x="506" y="249" fill="#cccccc" font-family="sans-serif" font-size="11">5xx: 0%</text>
  </g>

  <!-- Panel 3: Ledger Posts Per Second -->
  <g transform="translate(20, 360)">
    <rect width="570" height="290" rx="4" fill="#181b1f" stroke="#22252b" stroke-width="1" />
    <text x="16" y="26" fill="#d8d9da" font-family="sans-serif" font-size="13" font-weight="600">Double-Entry Ledger Posts per Second</text>
    <text x="430" y="26" fill="#8e8e93" font-family="sans-serif" font-size="11">Append-Only Invariant</text>

    <line x1="50" y1="70" x2="540" y2="70" stroke="#262930" stroke-dasharray="3,3" />
    <line x1="50" y1="130" x2="540" y2="130" stroke="#262930" stroke-dasharray="3,3" />
    <line x1="50" y1="190" x2="540" y2="190" stroke="#262930" stroke-dasharray="3,3" />
    <line x1="50" y1="240" x2="540" y2="240" stroke="#262930" stroke-dasharray="3,3" />

    <text x="20" y="74" fill="#737373" font-family="sans-serif" font-size="10">80/s</text>
    <text x="20" y="134" fill="#737373" font-family="sans-serif" font-size="10">50/s</text>
    <text x="20" y="194" fill="#737373" font-family="sans-serif" font-size="10">20/s</text>
    <text x="25" y="244" fill="#737373" font-family="sans-serif" font-size="10">0/s</text>

    <!-- Postings by Source Type -->
    <!-- REPAYMENT (blue) -->
    <path d="M50 240 Q 150 180, 250 150 T 400 120 T 540 115" fill="none" stroke="#2f54eb" stroke-width="2.5" />
    <!-- SAVINGS (green) -->
    <path d="M50 240 Q 150 200, 250 180 T 400 170 T 540 165" fill="none" stroke="#13c2c2" stroke-width="2.5" />
    <!-- DISBURSAL (purple) -->
    <path d="M50 240 Q 150 220, 250 215 T 400 210 T 540 205" fill="none" stroke="#722ed1" stroke-width="2" />

    <rect x="50" y="265" width="10" height="10" fill="#2f54eb" />
    <text x="66" y="274" fill="#cccccc" font-family="sans-serif" font-size="11">REPAYMENT</text>
    <rect x="180" y="265" width="10" height="10" fill="#13c2c2" />
    <text x="196" y="274" fill="#cccccc" font-family="sans-serif" font-size="11">SAVINGS</text>
    <rect x="290" y="265" width="10" height="10" fill="#722ed1" />
    <text x="306" y="274" fill="#cccccc" font-family="sans-serif" font-size="11">DISBURSAL</text>
    <text x="420" y="274" fill="#52c41a" font-family="sans-serif" font-size="11">✓ Total Debits == Credits</text>
  </g>

  <!-- Panel 4: Outbox Lag (Queue Depth) -->
  <g transform="translate(610, 360)">
    <rect width="275" height="290" rx="4" fill="#181b1f" stroke="#22252b" stroke-width="1" />
    <text x="16" y="26" fill="#d8d9da" font-family="sans-serif" font-size="13" font-weight="600">Outbox Queue Depth</text>
    
    <circle cx="137" cy="130" r="60" fill="none" stroke="#1f2937" stroke-width="10" />
    <circle cx="137" cy="130" r="60" fill="none" stroke="#52c41a" stroke-width="10" stroke-dasharray="377" stroke-dashoffset="350" />
    <text x="137" y="138" fill="#52c41a" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle">0</text>
    <text x="137" y="165" fill="#8c8c8c" font-family="sans-serif" font-size="12" text-anchor="middle">Pending Events</text>

    <rect x="20" y="210" width="235" height="60" rx="3" fill="#141619" />
    <text x="32" y="232" fill="#8c8c8c" font-family="sans-serif" font-size="11">Worker Status:</text>
    <text x="120" y="232" fill="#52c41a" font-family="sans-serif" font-size="11" font-weight="600">Healthy (ARQ)</text>
    <text x="32" y="252" fill="#8c8c8c" font-family="sans-serif" font-size="11">Processing Lag:</text>
    <text x="120" y="252" fill="#52c41a" font-family="sans-serif" font-size="11" font-weight="600">&lt; 45ms</text>
  </g>

  <!-- Panel 5: Background Batch Job Duration -->
  <g transform="translate(905, 360)">
    <rect width="275" height="290" rx="4" fill="#181b1f" stroke="#22252b" stroke-width="1" />
    <text x="16" y="26" fill="#d8d9da" font-family="sans-serif" font-size="13" font-weight="600">Batch Job Duration</text>
    
    <text x="24" y="65" fill="#8c8c8c" font-family="sans-serif" font-size="11">20-Member Collections Batch</text>
    <rect x="24" y="75" width="227" height="12" rx="3" fill="#22252b" />
    <rect x="24" y="75" width="27" height="12" rx="3" fill="#52c41a" />
    <text x="60" y="85" fill="#52c41a" font-family="sans-serif" font-size="11" font-weight="600">116ms (SLO &lt; 1000ms)</text>

    <text x="24" y="125" fill="#8c8c8c" font-family="sans-serif" font-size="11">Daily Accrual &amp; Overdue Job</text>
    <rect x="24" y="135" width="227" height="12" rx="3" fill="#22252b" />
    <rect x="24" y="135" width="45" height="12" rx="3" fill="#1890ff" />
    <text x="80" y="145" fill="#1890ff" font-family="sans-serif" font-size="11" font-weight="600">182ms</text>

    <text x="24" y="185" fill="#8c8c8c" font-family="sans-serif" font-size="11">Double-Entry Reconciliation Job</text>
    <rect x="24" y="195" width="227" height="12" rx="3" fill="#22252b" />
    <rect x="24" y="195" width="60" height="12" rx="3" fill="#722ed1" />
    <text x="95" y="205" fill="#722ed1" font-family="sans-serif" font-size="11" font-weight="600">240ms</text>

    <rect x="24" y="240" width="227" height="30" rx="3" fill="#141619" />
    <text x="137" y="260" fill="#52c41a" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ 100% SLO Adherence</text>
  </g>
</svg>
